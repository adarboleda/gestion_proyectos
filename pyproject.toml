[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "preparacion-datos"
version = "0.1.0"
description = "Preparación sin fuga de información de los datos de simulación NPPAD (001) y PWR 3L (002)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
preparar-datos = "preparacion_datos.cli:main"
preparar-pwr3l = "preparacion_pwr3l.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
